<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All In: the Physics Casino</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script defer src="lang.js"></script>
  <script defer src="game.js"></script>
  <script defer src="rounds.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <a class="home" href="/">Learning Physics</a><span class="sep" aria-hidden="true">/</span>
        <h1 data-i18n="title">All In: the Physics Casino</h1>
      </div>
      <div class="top-right">
        <button id="restart" type="button" class="link-btn" data-i18n="restart" hidden>New game</button>
        <div id="langs" class="levels small" role="radiogroup" aria-label="Language">
          <label><input type="radio" name="lang" value="en" checked><span title="English">EN</span></label>
          <label><input type="radio" name="lang" value="de"><span title="Deutsch">DE</span></label>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="board" class="board" aria-live="polite" hidden></div>
    <div id="stage"></div>
  </main>

  <footer class="wrap foot">

  </footer>

</html>
