# nginx site of learningphysics.ch (the source of truth; installed as
# /etc/nginx/sites-available/learningphysics, see README.md). The apps are static folders in the web
# root, deployed by deploy.sh: a new app needs no change here. teachingphysics.ch (the old domain)
# and www.learningphysics.ch redirect here, keeping the path.

server {
    server_name learningphysics.ch;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/learningphysics.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learningphysics.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # (no add_header in the locations below: it would drop these; caching is set with expires)
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/teachingphysics;
    index index.html;
    absolute_redirect off;

    # the hub, its settings (from the admin panel) and the apps; no-cache: browsers revalidate
    # (ETag), so a deploy is seen at once
    location = / {
        try_files /index.html =404;
        expires epoch;
    }
    location = /apps.json {
        root /var/www/teachingphysics/hub-data;
        try_files /apps.json =404;
        expires epoch;
    }
    location = /sets.json {
        root /var/www/teachingphysics/hub-data;
        try_files /sets.json =404;
        expires epoch;
    }
    # a file, or a folder's index.html; a folder without the slash is redirected to it (relative
    # Location: absolute_redirect off). Anything else that looks like a name, after a teacher's
    # three-letter identifier or not, is a teacher's set (learningphysics.ch/bys/3a-elektro, or
    # learningphysics.ch/3a-elektro: the default teacher's): the hub page, which shows the set (see
    # hub/index.html).
    location / {
        expires epoch;
        error_page 404 = @set;
    }
    location @set {
        if ($uri !~ "^/([a-z]{3}/)?[a-z0-9][a-z0-9-]{0,39}/?$") { return 404; }
        rewrite ^ /index.html break;
        expires epoch;
    }
    location /katex/ {
        try_files $uri =404;
        expires 30d;
    }
    # not served: the admin data and program, backups and hidden files
    location /hub-data/ { return 404; }
    location /hub-admin/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~ \.bak { return 404; }

    # the services (each its own repo and systemd unit)
    location = /electric-circuits { return 301 /electric-circuits/; }
    location /electric-circuits/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location = /crosswords { return 301 /crosswords/; }
    location /crosswords/ {
        proxy_pass http://127.0.0.1:8020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # Who Wants to Be a Physicist? (the millionaire repository); its old address /millionaire/ redirects here
    location = /wwtbap { return 301 /wwtbap/; }
    location /wwtbap/ {
        proxy_pass http://127.0.0.1:8030/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires epoch;
    }
    location = /millionaire { return 301 /wwtbap/; }
    location /millionaire/ { rewrite ^/millionaire/(.*)$ /wwtbap/$1 permanent; }
    # the TeXercises review (the admin service, logged in): an export to upload (up to 64 MB), its
    # collections and exercises previewed, their difficulty and feedback (hub-admin/sheets/review.py)
    location = /texercises { return 301 /texercises/; }
    location = /texercises/api/upload {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:8040/texercises/api/upload;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /texercises/ {
        proxy_pass http://127.0.0.1:8040/texercises/;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin { return 301 /admin/; }
    # the admin panel's exercise sheets: a TeXercises export to upload (up to 64 MB), and under
    # /admin/sheet/ the PDFs (made in the background) and the shared sheets' online versions
    location = /admin/api/texercises {
        client_max_body_size 64m;
        proxy_pass http://127.0.0.1:8040/api/texercises;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # the report of the exercises' review (the superuser uploads it in the Sheets tab; up to 8 MB)
    location = /admin/api/exercise-audit {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8040/api/exercise-audit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/sheet/ {
        proxy_pass http://127.0.0.1:8040/sheet/;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8040/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www and the old domain: to learningphysics.ch, the path kept
server {
    server_name www.learningphysics.ch;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/learningphysics.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learningphysics.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://learningphysics.ch$request_uri;
}
server {
    server_name teachingphysics.ch;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/teachingphysics.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teachingphysics.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://learningphysics.ch$request_uri;
}

# plain http, all three names (certbot answers its challenges through the nginx plugin)
server {
    server_name learningphysics.ch www.learningphysics.ch teachingphysics.ch;
    listen 80;
    listen [::]:80;
    return 301 https://learningphysics.ch$request_uri;
}
